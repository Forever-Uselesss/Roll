name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
  pull_request:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
          components: clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Build debug + defmt
        run: cargo build --verbose --profile dev --features defmt

      - name: Build Release
        run: cargo build --verbose --profile release

      - name: Clippy
        run: cargo clippy --verbose -- -D warnings

      - name: Audit
        run: cargo audit
